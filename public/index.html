<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08111f">
<title>Velocity Ludo</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="crown">♛</span><span>VELOCITY LUDO</span></div>
    <div class="room-pill">ROOM <b id="roomCode">------</b></div>
  </header>

  <main class="game-wrap">
    <div class="player-strip" id="players"></div>

    <section class="board-shell">
      <canvas id="board"></canvas>
      <div class="turn-badge" id="turnBadge">Waiting for players…</div>
    </section>

    <section class="control">
      <div class="dice-stage">
        <div class="dice" id="dice"><span>?</span></div>
      </div>
      <button id="roll" class="roll-btn">ROLL DICE</button>
      <div class="hint" id="hint">Join with the room code to play.</div>
    </section>

    <div class="bottom-actions">
      <button class="round" id="sound">🔊</button>
      <button class="round" id="music">♪</button>
      <button class="round" id="chat">💬</button>
      <button class="round" id="settings">⚙</button>
    </div>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">Ludo</div>
      <div id="modalText"></div>
      <button class="roll-btn" id="modalButton">CONTINUE</button>
    </div>
  </div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/game.js"></script>
</body>
</html>
