<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Velocity Ludo</title>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div><div class="brand">VELOCITY LUDO</div><div id="roomLabel">ROOM —</div></div>
    <div class="connection" id="connection">CONNECTING</div>
  </header>
  <main>
    <section class="players" id="players"></section>
    <section class="board-wrap">
      <canvas id="board"></canvas>
      <div class="dice-card"><div class="dice" id="dice">?</div><button id="roll">ROLL DICE</button></div>
    </section>
    <section class="controls"><button id="start">START GAME</button><button id="rematch" class="hidden">PLAY AGAIN</button></section>
    <div class="status" id="status">Joining room…</div>
  </main>
</div>
<script src="/game.js"></script>
</body>
</html>
